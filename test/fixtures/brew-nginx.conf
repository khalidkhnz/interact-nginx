
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    # Add this proxy cache configuration
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=STATIC:10m max_size=10g inactive=60m use_temp_path=off;

    # Set proxy temp path to avoid permission issues
    proxy_temp_path /tmp/nginx_proxy_temp;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            root   html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name app.example.test login.example.test;

        return 301 https://$host$request_uri;
    }

    # HTTPS server — proxies to localhost:3000
    server {
        listen       443 ssl;
        server_name  app.example.test login.example.test;

        ssl_certificate      /opt/homebrew/etc/nginx/ssl/app.example.test+1.pem;
        ssl_certificate_key  /opt/homebrew/etc/nginx/ssl/app.example.test+1-key.pem;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Next.js specific configurations
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for Next.js development
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
        }

        # Handle JavaScript and static files - disable buffering to fix content length mismatch
        location ~* \.(js|css|json|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            proxy_pass http://localhost:3000;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle Next.js static files
        location /_next/static {
            proxy_cache STATIC;
            proxy_pass http://localhost:3000;
            proxy_buffering off;
            proxy_set_header Host $host;
        }
    }

    include servers/*;
}
